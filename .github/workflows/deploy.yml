# EQUILOCK — деплой у production на Vercel через Vercel CLI.
# Запускається на кожен push у main. Автодеплой самого Vercel з Git вимкнено у vercel.json,
# тож production оновлює лише цей workflow.
#
# Потрібні секрети репозиторію (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN      — токен з vercel.com/account/tokens
#   VERCEL_ORG_ID     — "orgId" з .vercel/project.json (після `vercel link`)
#   VERCEL_PROJECT_ID — "projectId" звідти ж

name: Deploy to Vercel (production)

on:
  push:
    branches:
      - main

# Два push поспіль: другий деплой чекає, поки завершиться перший, а не біжить паралельно
concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
